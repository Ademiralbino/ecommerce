<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MinhaLoja - Loja Virtual Pro</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
</head>
<body>

<!-- Cabeçalho / Navbar -->
<header class="header">
  <div class="container header-container">
    <div class="logo">
      <a href="#">MinhaLoja</a>
    </div>

    <nav class="nav-menu" id="nav-menu">
      <ul>
        <li><a href="#produtos">Produtos</a></li>
        <li><a href="#ofertas">Ofertas</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button id="cart-btn" class="cart-btn" aria-label="Abrir carrinho de compras">
        🛒 <span id="cart-count" class="cart-badge">0</span>
      </button>
      <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menu mobile">
        ☰
      </button>
    </div>
  </div>
</header>

<!-- Banner Oferta com Cronômetro -->
<section class="banner-oferta" id="ofertas">
  <div class="container text-center">
    <h2>Oferta Especial por Tempo Limitado!</h2>
    <div id="timer" class="timer-display">00:00:00</div>
  </div>
</section>

<!-- Seção Principal de Produtos -->
<main class="container main-content" id="produtos">
  <h2 class="section-title">Nossos Produtos</h2>

  <!-- Barra de Controles: Pesquisa, Filtros e Ordenação -->
  <div class="controls-bar">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Pesquisar produto..." aria-label="Pesquisar produto">
    </div>

    <div class="category-filters">
      <button class="filter-btn active" data-category="todos" aria-selected="true">Todos</button>
      <button class="filter-btn" data-category="eletronicos" aria-selected="false">Eletrônicos</button>
      <button class="filter-btn" data-category="acessorios" aria-selected="false">Acessórios</button>
      <button class="filter-btn" data-category="calcados" aria-selected="false">Calçados</button>
    </div>

    <div class="sort-box">
      <label for="sort-select">Ordenar por:</label>
      <select id="sort-select">
        <option value="default">Destaques</option>
        <option value="price-low">Menor Preço</option>
        <option value="price-high">Maior Preço</option>
        <option value="name-asc">Nome (A-Z)</option>
        <option value="name-desc">Nome (Z-A)</option>
      </select>
    </div>
  </div>

  <!-- Mensagem quando não houver produtos -->
  <div id="no-products-msg" class="no-products" style="display: none;">
    <p>Nenhum produto encontrado com os filtros selecionados.</p>
  </div>

  <!-- Grid de Produtos -->
  <div id="product-grid" class="product-grid"></div>
</main>

<!-- Modal de Detalhes do Produto -->
<div id="product-modal-overlay" class="modal-overlay" aria-hidden="true">
  <div class="modal-content">
    <button id="close-modal-btn" class="close-modal">&times;</button>
    <div class="modal-body">
      <div class="modal-img-container">
        <img id="modal-img" src="" alt="">
      </div>
      <div class="modal-info">
        <span id="modal-category" class="badge-category"></span>
        <h3 id="modal-title"></h3>
        <p id="modal-price" class="modal-price"></p>
        <p id="modal-desc" class="modal-desc"></p>
        <div class="modal-specs">
          <h4>Especificações:</h4>
          <ul id="modal-specs-list"></ul>
        </div>
        <button id="modal-add-to-cart-btn" class="btn-primary">Adicionar ao Carrinho</button>
      </div>
    </div>
  </div>
</div>

<!-- Drawer (Aba Lateral) do Carrinho -->
<div id="cart-overlay" class="cart-overlay"></div>
<aside id="cart-drawer" class="cart-drawer" aria-hidden="true">
  <div class="cart-header">
    <h3>Seu Carrinho</h3>
    <button id="close-cart" class="close-cart">&times;</button>
  </div>

  <div id="cart-items" class="cart-items"></div>

  <div class="cart-footer">
    <!-- Frete por CEP -->
    <div class="calc-section">
      <label for="cep-input">Calcular Frete (CEP):</label>
      <div class="input-group">
        <input type="text" id="cep-input" placeholder="00000-000" maxlength="9">
        <button id="calc-shipping-btn">Calcular</button>
      </div>
      <p id="shipping-info" class="info-text"></p>
    </div>

    <!-- Cupom de Desconto -->
    <div class="calc-section">
      <label for="coupon-input">Cupom de Desconto:</label>
      <div class="input-group">
        <input type="text" id="coupon-input" placeholder="Ex: PRIMEIRA10">
        <button id="apply-coupon-btn">Aplicar</button>
        <button id="remove-coupon-btn" style="display: none;" class="btn-danger">Remover</button>
      </div>
      <p id="coupon-info" class="info-text"></p>
    </div>

    <!-- Resumo do Pedido -->
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal:</span><span id="subtotal-val">R$ 0.00</span></div>
      <div class="summary-row"><span>Frete:</span><span id="shipping-val">R$ 0.00</span></div>
      <div class="summary-row"><span>Desconto:</span><span id="discount-val">- R$ 0.00</span></div>
      <hr>
      <div class="summary-row total"><span>Total:</span><span id="total-val">R$ 0.00</span></div>
    </div>

    <button id="checkout-btn" class="btn-checkout">Finalizar Pedido via WhatsApp</button>
  </div>
</aside>

<!-- Notificações Toast -->
<div id="toast-container" class="toast-container"></div>

<!-- Script JavaScript -->
<script src="assets/js/script.js"></script>
</body>
</html>
